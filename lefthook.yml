pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    lint-ws:
      run: bunx sherif@latest

commit-msg:
  commands:
    "lint commit message":
      run: bun commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: bun typecheck
    bun-version:
      run: bun test scripts/test/bun-version.test.ts
    data-through-api:
      run: bun test scripts/test/data-through-api.test.ts
    infisical:
      run: infisical scan git-changes --staged --verbose
